<h1>Display & Positioning Demo</h1>

<div class="demo-box">
    <span style="display:inline; background:yellow;">Inline</span>
    <span style="display:block; background:lightblue;">Block</span>
    <span style="display:inline-block; background:lightgreen;">Inline-Block</span>
</div>

<div style="position:relative; height:200px; background:#f0f0f0; margin:20px 0;">
    <div style="position:absolute; top:20px; right:20px; background:#d63384; color:white; padding:10px;">
        Absolute Position
    </div>
    <div style="position:sticky; top:0; background:#333; color:white; padding:10px;">
        Sticky Header
    </div>
</div>
